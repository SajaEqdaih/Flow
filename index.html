ap:10px;margin-bottom:20px}.dialog-title{font-size:20px;margin:0}.close{border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:23px}.dialog-actions{display:flex;gap:9px;margin-top:21px}.dialog-actions>*{flex:1}.bottom-nav{display:flex;gap:8px;max-width:1024px;margin:0 auto 0;position:fixed;left:0;right:0;bottom:0;background:#ffffffeb;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:9px 18px max(10px,env(safe-area-inset-bottom));z-index:10}.nav-item{flex:1;border:0;background:transparent;color:#89948b;display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;font-size:12px;min-height:56px}.nav-item.active{color:var(--green);font-weight:760}.nav-icon{font-size:24px;line-height:1}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{border:1px solid var(--line);background:#fff;border-radius:15px;padding:18px}.metric small{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:22px;margin-top:9px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px}.filter-btn{border:1px solid var(--line);border-radius:30px;background:white;padding:8px 14px;color:#657166;font-size:13px}.filter-btn.active{background:var(--green);border-color:var(--green);color:white}.toast{position:fixed;bottom:105px;right:50%;transform:translateX(50%);z-index:50;background:#183d2f;color:white;border-radius:11px;padding:11px 19px;font-size:13px;box-shadow:var(--shadow)}.chat-message{background:#f0f5ef;padding:13px 15px;border-radius:14px;margin-top:14px;line-height:1.9;font-size:14px;white-space:pre-wrap}.question-list{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.chip{border:1px solid var(--line);border-radius:20px;background:#fff;padding:9px 12px;color:#44604c;font-size:12px}.success-wrap{text-align:center;padding:15px 3px}.success-icon{display:grid;place-items:center;margin:0 auto 20px;width:70px;height:70px;border-radius:50%;background:#e5f3e9;color:#1a784e;font-size:33px}.success-title{font-size:23px;margin-bottom:9px}.success-amount{font-size:34px;font-weight:750;direction:ltr;color:var(--green);margin:14px 0}.hr{border:0;border-top:1px solid var(--line);margin:20px 0}.smallprint{font-size:12px;color:var(--muted);line-height:1.8}

<body class="gated">
  <div id="app" class="app-shell">

  <script>
/* FLOW — standalone GitHub Pages review build. No real transfers or cloud sync. */
'use strict';
const STORAGE_KEY='flow-review-v3';
const $=id=>document.getElementById(id);
const names={tiktok:'TikTok',paypal:'PayPal',usdt:'USDT',usd:'بنك دولار',ils:'بنك شيكل'};
const signs={tiktok:'$',paypal:'$',usdt:'USDT',usd:'$',ils:'₪'};
const ids=Object.keys(names);
const icons={tiktok:'♪',paypal:'P',usdt:'₮',usd:'▤',ils:'▤'};
const defaultData=()=>{const b={tiktok:0,paypal:0,usdt:0,usd:0,ils:0};return {balances:{...b},opening:{...b},openingAt:{},deleted:{},tx:[],created:new Date().toISOString()}};
/* الرصيد = الرصيد الافتتاحي + أثر كل الحركات. هذا ما يسمح بتعديل/حذف أي حركة وإعادة حساب الأرصدة تلقائيًا. */
function computeBalances(d){const b={};ids.forEach(k=>{let v=Number(d.opening[k])||0;d.tx.forEach(t=>{const c=txChange(t,k);if(c!==null)v+=c});b[k]=Math.round((v+Number.EPSILON)*100)/100});return b}
function normalize(d){if(!d||typeof d!=='object')return d;d.tx=Array.isArray(d.tx)?d.tx:[];d.deleted=d.deleted&&typeof d.deleted==='object'?d.deleted:{};d.openingAt=d.openingAt&&typeof d.openingAt==='object'?d.openingAt:{};if(!d.opening||typeof d.opening!=='object'){const eff=computeBalances({opening:{},tx:d.tx});d.opening={};ids.forEach(k=>{d.opening[k]=Math.round(((Number(d.balances[k])||0)-eff[k]+Number.EPSILON)*100)/100})}ids.forEach(k=>{if(!Number.isFinite(d.opening[k]))d.opening[k]=0});return d}
let data=load(),screen='home',selected='paypal',route='paypal',historyFilter='all',reportFilter='month',pending=null;
function load(){try{const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(raw&&raw.balances&&Array.isArray(raw.tx)&&ids.every(k=>Number.isFinite(raw.balances[k])))return normalize(raw);}catch(e){}return defaultData()}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){notify('تعذر حفظ البيانات في هذا المتصفح')}window.FlowCloud&&FlowCloud.changed()}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const round=(n,dec=2)=>Math.round((Number(n)+Number.EPSILON)*10**dec)/10**dec;
const fmt=(value,wallet='usd')=>{const n=Number(value||0);const val=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(n));const c=signs[wallet]||'$';return c==='USDT'?`${n<0?'-':''}${val} USDT`:`${n<0?'-':''}${c}${val}`};
const money=n=>fmt(n,'usd');
const time=t=>new Date(t).toLocaleDateString('ar-PS',{day:'numeric',month:'short',year:'numeric'});
const walIcon=k=>`<span class="wallet-icon ${k}">${icons[k]}</span>`;
function go(s){screen=s;render();scrollTo({top:0,behavior:'instant'})}
function notify(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.hidden=true,3200)}
function titlePanel(t,sub=''){return `<h1 class="page-title">${t}</h1>${sub?`<p class="page-sub">${sub}</p>`:''}`}
function walletItems(){return ids.map(k=>`<button class="wallet-item" data-wallet="${k}" aria-label="عرض حساب ${names[k]}">${walIcon(k)}<span class="wallet-name">${names[k]}</span><span class="wallet-amount">${fmt(data.balances[k],k)}</span><span class="chev">‹</span></button>`).join('')}
function home(){const total=round(data.balances.tiktok+data.balances.paypal+data.balances.usdt+data.balances.usd);return `<div class="columns"><div><h1 class="welcome">مرحبًا عبد الرحمن 👋</h1><p class="subtitle">كل أرصدتك بمكان واحد، وبكل بساطة.</p><div class="balance-hero"><div class="hero-line"><span>إجمالي الأرصدة بالدولار</span><span aria-hidden="true">◉</span></div><div class="hero-amount">${money(total)}</div><div class="hero-caption">يشمل USDT بالقيمة الاسمية، ولا يشمل بنك الشيكل</div></div><section class="panel section-spacing"><div class="section-row"><h2 class="section-heading">أرصدتي</h2><span class="tiny-note">اضغط على الحساب للتفاصيل</span></div><div class="wallet-list">${walletItems()}</div></section></div><aside class="home-right"><button class="btn primary full" data-action="new">＋ عملية جديدة</button><button class="flow-entry" data-action="assistant"><span class="sparkle">✧</span><span><strong>مساعد Flow</strong><small>اسأل عن أرصدتك وحركاتك</small></span><span class="chev">‹</span></button><div class="panel"><div class="section-row"><h2 class="section-heading">آخر العمليات</h2><button class="filter-btn" data-nav="transactions">عرض الكل</button></div>${txList(data.tx.slice(0,3),'all')}</div><p class="smallprint">بياناتك محفوظة في حسابك وتتزامن بين أجهزتك. التطبيق يسجّل الحركات فقط، ولا تُنفَّذ تحويلات فعلية.</p><div class="dev-credit">تطوير وبرمجة: <b dir="rtl">م. سجى اقديح</b> · <span dir="ltr">0597054487</span></div></aside></div>`}
function txChange(t,k){if(t.kind==='transfer'){if(t.from===k)return -t.amount;if(t.to===k)return t.received;return null}if(t.kind==='manual'&&t.wallet===k)return t.sign*t.amount;return null}
function txList(items,context){if(!items.length)return '<div class="empty">لا توجد عمليات مسجلة بعد</div>';return `<div class="line-list">${items.map(t=>{let amount,unit='usd';if(context!=='all'){amount=txChange(t,context);unit=context}else{amount=t.kind==='transfer'?-t.amount:t.kind==='manual'?t.sign*t.amount:t.kind==='profit'?t.amount:-t.amount;unit=t.from||t.wallet||'usd'}const sign=amount===null?'':amount>0?'+':amount<0?'−':'';return `<div class="tx-row" data-tx="${t.id}" role="button" tabindex="0"><div><div class="tx-title">${escapeHTML(t.title)}</div><div class="tx-date">${time(t.date)}</div></div><div class="tx-amount ${amount>=0?'positive':'negative'}">${sign}${fmt(Math.abs(amount||0),unit)}</div></div>`}).join('')}</div>`}
function walletPage(){const k=selected,related=data.tx.filter(t=>(t.from===k||t.to===k||t.wallet===k));const mainAction=k==='tiktok'?'tiktok':k==='paypal'?'paypal':k==='usdt'?'usdt':null;return `<div class="section-shell"><button class="back-button" data-nav="home">→ رجوع إلى أرصدتي</button><div class="panel"><div style="display:flex;align-items:center;gap:12px">${walIcon(k)}<h1 class="page-title" style="margin:0">${names[k]}</h1></div><p class="detail-label" style="margin-top:25px">الرصيد الحالي</p><div class="detail-balance">${fmt(data.balances[k],k)}</div><div class="detail-actions">${mainAction?`<button class="btn primary" data-route="${mainAction}">${k==='tiktok'?'تحويل إلى PayPal':k==='paypal'?'سحب إلى USDT':'سحب إلى البنك'}</button>`:''}<button class="btn secondary" data-action="manual" data-wallet="${k}">تعديل الرصيد</button></div></div><section class="panel section-spacing"><div class="section-row"><h2 class="section-heading">حركات ${names[k]}</h2><span class="tiny-note">${related.length} عملية</span></div>${txList(related.slice(0,12),k)}</section></div>`}
const routeMeta={tiktok:{title:'تحويل أرباح TikTok',subtitle:'من TikTok إلى PayPal',from:'tiktok',to:'paypal'},paypal:{title:'سحب رصيد PayPal',subtitle:'من PayPal إلى USDT — مع حساب الرسوم',from:'paypal',to:'usdt'},usdt:{title:'سحب USDT إلى البنك',subtitle:'إلى بنك الدولار أو بنك الشيكل',from:'usdt',to:'usd'}};
function actionsPage(){return `<div class="section-shell">${titlePanel('عملية جديدة','اختار شو بدك تعمل. كل عملية بتحتاج خطوات قليلة فقط.')}<div class="action-stack">${Object.entries(routeMeta).map(([key,r])=>`<button class="simple-action" data-route="${key}"><span class="action-mark">${key==='tiktok'?'⇄':key==='paypal'?'↓':'▤'}</span><span><b>${r.title}</b><small>${r.subtitle}</small></span><span class="chev">‹</span></button>`).join('')}<button class="simple-action" data-action="manual"><span class="action-mark">＋</span><span><b>إضافة أو خصم رصيد</b><small>تعديل يدوي لأحد الحسابات</small></span><span class="chev">‹</span></button><button class="simple-action" data-action="entry"><span class="action-mark">＋</span><span><b>تسجيل ربح أو مصروف</b><small>يتضاف إلى الملخص المالي</small></span><span class="chev">‹</span></button></div></div>`}
function withdrawPage(){const r=routeMeta[route];return `<div class="section-shell"><button class="back-button" data-nav="actions">→ رجوع للعمليات</button>${titlePanel(r.title,r.subtitle)}<div class="panel"><div class="route-summary">${names[r.from]} ← ${route==='usdt'?'الحساب البنكي':names[r.to]}<div class="helper">المتاح الآن: ${fmt(data.balances[r.from],r.from)}</div></div>${route==='usdt'?`<label class="field-label" for="destination">الحساب المستلم</label><select class="field" id="destination"><option value="usd">بنك دولار</option><option value="ils">بنك شيكل</option></select>`:''}<label class="field-label" for="transferAmount">المبلغ المراد تحويله</label><input id="transferAmount" class="field money-field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" autocomplete="off"/><p class="helper">${route==='paypal'?'الحد الأدنى $8 والحد الأقصى $2,490 لكل عملية.':'أدخل المبلغ من الرصيد المتاح.'}</p>${route==='usdt'?`<label class="field-label" for="variableFee">رسوم السحب (USDT)</label><input id="variableFee" class="field" type="number" value="0" min="0" step="0.01" inputmode="decimal"/><div id="exchangeWrap" hidden><label class="field-label" for="exchangeRate">سعر الصرف: كم شيكل مقابل 1 USDT؟</label><input id="exchangeRate" class="field" type="number" step="0.0001" min="0" placeholder="أدخل سعر الصرف الفعلي" inputmode="decimal"/></div>`:''}<div id="calculation"></div><button class="btn primary full" id="reviewBtn" disabled>مراجعة العملية</button></div></div>`}
function calculate(){const field=$('transferAmount');if(!field)return null;const r=routeMeta[route],amount=Number(field.value),destination=route==='usdt'?$('destination').value:r.to;const feeFixed=route==='paypal'?6:0;const feeRate=route==='paypal'?round(amount*.005):0;const variableFee=route==='usdt'?Number($('variableFee').value):0;const fees=round(feeFixed+feeRate+variableFee);const net=round(amount-fees);const fx=route==='usdt'&&destination==='ils'?Number($('exchangeRate').value):1;const received=round(net*fx);let error='';if(!field.value.trim()||!Number.isFinite(amount)||amount<=0)error='أدخل مبلغًا صحيحًا.';else if(!Number.isInteger(round(amount*100))||round(amount,2)!==amount)error='استخدم منزلتين عشريتين كحد أقصى.';else if(amount>data.balances[r.from])error='المبلغ أكبر من الرصيد المتاح.';else if(route==='paypal'&&(amount<8||amount>2490))error='المبلغ المسموح لسحب PayPal من 8 إلى 2490 دولار.';else if(!Number.isFinite(fees)||fees<0||net<=0)error='الرسوم يجب أن تكون أقل من المبلغ.';else if(route==='usdt'&&(!Number.isFinite(variableFee)||variableFee<0))error='أدخل قيمة رسوم صحيحة.';else if(route==='usdt'&&destination==='ils'&&!(fx>0))error='أدخل سعر صرف صحيحًا.';return {from:r.from,to:destination,amount,fees,feeFixed,feeRate,variableFee,received,net,fx,error,title:r.title,rateCurrency:r.from}}
function updateCalc(){if(!$('calculation'))return;const c=calculate();$('reviewBtn').disabled=!!c.error;$('calculation').innerHTML=`<div class="cost-summary"><div class="summary-line"><span>المبلغ المطلوب</span><strong>${fmt(c.amount,c.from)}</strong></div>${route==='paypal'?`<div class="summary-line"><span>رسوم ثابتة</span><strong>${money(c.feeFixed)}</strong></div><div class="summary-line"><span>رسوم 0.5%</span><strong>${money(c.feeRate)}</strong></div>`:''}${route==='usdt'?`<div class="summary-line"><span>رسوم السحب</span><strong>${fmt(c.variableFee,'usdt')}</strong></div>`:''}<div class="summary-line net"><span>الصافي المستلم</span><strong>${fmt(Math.max(0,c.received),c.to)}</strong></div></div>${c.error?`<p class="warn">${escapeHTML(c.error)}</p>`:''}`}
function openReview(){pending=calculate();if(pending.error){notify(pending.error);return}showDialog(`<div class="dialog-head"><h2 class="dialog-title">راجع العملية</h2><button class="close" data-close="true" aria-label="إغلاق">×</button></div><p class="page-sub">تأكد من البيانات قبل تسجيل الحركة.</p><div class="cost-summary"><div class="summary-line"><span>من</span><b>${names[pending.from]}</b></div><div class="summary-line"><span>إلى</span><b>${names[pending.to]}</b></div><div class="summary-line"><span>المبلغ</span><strong>${fmt(pending.amount,pending.from)}</strong></div><div class="summary-line"><span>إجمالي الرسوم</span><strong>${fmt(pending.fees,pending.from)}</strong></div><div class="summary-line net"><span>الصافي المستلم</span><strong>${fmt(pending.received,pending.to)}</strong></div></div><p class="notice">هذا تسجيل تجريبي داخل التطبيق، وليس تحويلًا حقيقيًا عبر PayPal أو البنك.</p><div class="dialog-actions"><button class="btn secondary" data-close="true">تعديل</button><button class="btn primary" id="finalConfirm">تأكيد التسجيل</button></div>`)}
function recordTransfer(){if(!pending)return;const c=pending;const last=calculate();if(!last||last.error||JSON.stringify([last.from,last.to,last.amount,last.fees,last.fx])!==JSON.stringify([c.from,c.to,c.amount,c.fees,c.fx])){closeDialog();notify('تغيرت البيانات. راجع العملية مرة ثانية.');return}if(data.balances[c.from]<c.amount){closeDialog();notify('الرصيد لم يعد كافيًا.');return}data.balances[c.from]=round(data.balances[c.from]-c.amount);data.balances[c.to]=round(data.balances[c.to]+c.received);data.tx.unshift({id:cryptoId(),kind:'transfer',title:c.title,from:c.from,to:c.to,amount:c.amount,fees:c.fees,received:c.received,fx:c.fx,date:new Date().toISOString()});persist();pending=null;showDialog(`<div class="success-wrap"><div class="success-icon">✓</div><h2 class="success-title">تم تسجيل العملية</h2><p class="page-sub">تم تحديث الأرصدة داخل النسخة التجريبية.</p><div class="success-amount">${fmt(c.received,c.to)}</div><p class="helper">الصافي المُضاف إلى ${names[c.to]}</p><button class="btn primary full" data-home="true" style="margin-top:22px">العودة للرئيسية</button></div>`)}
function cryptoId(){return Date.now()+'-'+Math.random().toString(36).slice(2,10)}
function showDialog(html){$('dialog').innerHTML=html;$('overlay').hidden=false;document.body.style.overflow='hidden'}
function closeDialog(){$('overlay').hidden=true;document.body.style.overflow='';$('dialog').innerHTML=''}
function manualDialog(wallet='paypal'){showDialog(`<div class="dialog-head"><h2 class="dialog-title">تعديل الرصيد</h2><button class="close" data-close="true">×</button></div><p class="page-sub">أضف أو اخصم مبلغًا، أو حدّد الرصيد الحالي الفعلي مباشرة، أو غيّر الرصيد الافتتاحي.</p><label for="manualWallet" class="field-label">الحساب</label><select id="manualWallet" class="field">${ids.map(k=>`<option value="${k}" ${wallet===k?'selected':''}>${names[k]}</option>`).join('')}</select><label for="manualAction" class="field-label">نوع التعديل</label><select id="manualAction" class="field"><option value="1">إضافة رصيد</option><option value="-1">خصم رصيد</option><option value="set">تحديد الرصيد الحالي</option><option value="opening">تحديد الرصيد الافتتاحي</option></select><label for="manualAmount" id="manualAmountLabel" class="field-label">المبلغ</label><input id="manualAmount" class="field" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"/><p class="helper" id="manualHint"></p><label for="manualNote" class="field-label">ملاحظة (اختياري)</label><input id="manualNote" class="field" placeholder="سبب التعديل"/><div class="dialog-actions"><button class="btn secondary" data-close="true">إلغاء</button><button class="btn primary" id="saveManual">حفظ التعديل</button></div>`);const upd=()=>{const w=$('manualWallet').value,m=$('manualAction').value;$('manualAmountLabel').textContent=m==='set'?'الرصيد الحالي الجديد':m==='opening'?'الرصيد الافتتاحي الجديد':'المبلغ';$('manualHint').textContent=m==='set'?'الرصيد الحالي الآن: '+fmt(data.balances[w],w)+'. سيُسجَّل الفرق كحركة تعديل.':m==='opening'?'الرصيد الافتتاحي الحالي: '+fmt(data.opening[w],w)+'. الرصيد الحالي = الافتتاحي + أثر كل الحركات.':''};$('manualWallet').addEventListener('change',upd);$('manualAction').addEventListener('change',upd);upd()}
function saveManual(){const wallet=$('manualWallet').value,mode=$('manualAction').value,amount=Number($('manualAmount').value),note=$('manualNote').value.trim();const badNum=!Number.isFinite(amount)||round(amount)!==amount;if(mode==='opening'){if(badNum||amount<0){notify('أدخل رصيدًا افتتاحيًا صحيحًا بمنزلتين عشريتين.');return}const old=data.opening[wallet];data.opening[wallet]=amount;const nb=computeBalances(data);if(nb[wallet]<0){data.opening[wallet]=old;notify('لا يمكن الحفظ: الرصيد الحالي سيصبح سالبًا.');return}data.openingAt[wallet]=Date.now();data.balances=nb;persist();closeDialog();go('home');notify('تم حفظ الرصيد الافتتاحي');return}if(mode==='set'){if(badNum||amount<0){notify('أدخل رصيدًا صحيحًا بمنزلتين عشريتين.');return}const diff=round(amount-data.balances[wallet]);if(diff===0){notify('الرصيد الحالي مطابق لما أدخلته.');return}data.balances[wallet]=amount;data.tx.unshift({id:cryptoId(),kind:'manual',title:note||('تعديل الرصيد إلى '+fmt(amount,wallet)),wallet,sign:diff>0?1:-1,amount:Math.abs(diff),date:new Date().toISOString(),fees:0});persist();closeDialog();go('home');notify('تم تحديد الرصيد الحالي وحفظ الحركة');return}const sign=Number(mode);if(!(amount>0)||badNum){notify('أدخل مبلغًا صحيحًا بمنزلتين عشريتين.');return}if(sign<0&&amount>data.balances[wallet]){notify('الرصيد غير كافٍ.');return}data.balances[wallet]=round(data.balances[wallet]+sign*amount);data.tx.unshift({id:cryptoId(),kind:'manual',title:note|| (sign>0?'إضافة رصيد يدوي':'خصم رصيد يدوي'),wallet,sign,amount,date:new Date().toISOString(),fees:0});persist();closeDialog();go('home');notify('تم تعديل الرصيد وحفظ الحركة')}
function entryDialog(){showDialog(`<div class="dialog-head"><h2 class="dialog-title">ربح أو مصروف</h2><button class="close" data-close="true">×</button></div><p class="page-sub">يُضاف إلى الملخص فقط. لا يغيّر أي رصيد تلقائيًا حتى لا تُحتسب الأموال مرتين.</p><label for="entryKind" class="field-label">النوع</label><select id="entryKind" class="field"><option value="profit">تسجيل ربح</option><option value="expense">تسجيل مصروف</option></select><label for="entryAmount" class="field-label">المبلغ بالدولار</label><input type="number" inputmode="decimal" min="0.01" step="0.01" id="entryAmount" class="field" placeholder="0.00"/><label for="entryNote" class="field-label">الوصف</label><input id="entryNote" class="field" placeholder="مثال: أتعاب خدمة / مصروف تشغيل"/><div class="dialog-actions"><button class="btn secondary" data-close="true">إلغاء</button><button class="btn primary" id="saveEntry">حفظ</button></div>`)}
function saveEntry(){const kind=$('entryKind').value,amount=Number($('entryAmount').value),note=$('entryNote').value.trim();if(!(amount>0)||!Number.isFinite(amount)||round(amount)!==amount||!note){notify('أدخل مبلغًا صحيحًا ووصفًا للعملية.');return}data.tx.unshift({id:cryptoId(),kind,amount,title:note,date:new Date().toISOString(),fees:0});persist();closeDialog();go('reports');notify('تم حفظ العملية')}
function filteredTx(t,filter){if(filter==='all')return true;const d=new Date(t.date),now=new Date();return filter==='today'?(d.toDateString()===now.toDateString()):d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}
function transactionsPage(){const tx=data.tx.filter(t=>filteredTx(t,historyFilter));return `<div class="section-shell">${titlePanel('العمليات','كل الحركات المسجلة. اضغط على أي حركة لتعديلها أو حذفها.')}<div class="filters">${[['all','الكل'],['today','اليوم'],['month','هذا الشهر']].map(([k,t])=>`<button class="filter-btn ${historyFilter===k?'active':''}" data-historyfilter="${k}">${t}</button>`).join('')}</div><div class="panel">${txList(tx,'all')}</div></div>`}
function financials(){const tx=data.tx.filter(t=>filteredTx(t,reportFilter));const profit=round(tx.filter(t=>t.kind==='profit').reduce((s,t)=>s+t.amount,0));const directExpense=round(tx.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0));const fees=round(tx.filter(t=>t.kind==='transfer').reduce((s,t)=>s+(t.fees||0),0));return {profit,expense:round(directExpense+fees),fees,net:round(profit-directExpense-fees)}}
function reportsPage(){const f=financials();return `<div class="section-shell">${titlePanel('الملخص المالي','الأرباح والمصروفات المسجلة، بعيدًا عن التحويلات الداخلية.')}<div class="filters">${[['today','اليوم'],['month','هذا الشهر'],['all','الكل']].map(([k,t])=>`<button class="filter-btn ${reportFilter===k?'active':''}" data-reportfilter="${k}">${t}</button>`).join('')}</div><div class="metric-grid"><div class="metric"><small>الأرباح</small><strong class="positive">${money(f.profit)}</strong></div><div class="metric"><small>المصروفات والرسوم</small><strong class="negative">${money(f.expense)}</strong></div><div class="metric"><small>الصافي المسجل</small><strong>${money(f.net)}</strong></div></div><div class="panel section-spacing"><div class="section-row"><h2 class="section-heading">تفصيل المصروفات</h2></div><div class="summary-line"><span>رسوم السحب والتحويل</span><strong>${money(f.fees)}</strong></div><div class="summary-line"><span>مصروفات مدخلة يدويًا</span><strong>${money(round(f.expense-f.fees))}</strong></div></div><div style="margin-top:16px"><button class="btn primary full" data-action="entry">＋ تسجيل ربح أو مصروف</button></div><p class="smallprint">الإيداعات والتحويلات بين الحسابات ليست أرباحًا بحد ذاتها. التقارير بالدولار فقط، ولا تُضاف مبالغ الشيكل إلى الإجمالي تلقائيًا.</p></div>`}
function assistantDialog(){showDialog(`<div class="dialog-head"><h2 class="dialog-title">✧ مساعد Flow</h2><button class="close" data-close="true">×</button></div><p class="page-sub">جرّب أسئلة عن أرصدتك وعمولاتك المسجلة.</p><div class="question-list"><button class="chip" data-question="كم رصيد بايبال؟">رصيد PayPal</button><button class="chip" data-question="كم دفعت رسوم؟">رسوم السحب</button><button class="chip" data-question="كم أرباحي؟">أرباحي</button><button class="chip" data-question="وين راحت مصروفاتي؟">مصروفاتي</button></div><div id="assistantAnswer" class="chat-message">مرحبًا عبد الرحمن! كيف أساعدك اليوم؟</div><label class="field-label" for="assistantQuestion">اسأل بالعربي</label><input class="field" id="assistantQuestion" placeholder="مثال: كم دفعت رسوم؟"/><button class="btn primary full" id="askAssistant" style="margin-top:12px">اسأل Flow</button><p class="smallprint">المساعد الحالي حسابي محلي، وليس ذكاءً اصطناعيًا سحابيًا. لا يرسل بياناتك إلى الخارج.</p>`)}
function answerAssistant(q){q=String(q||'').trim();const fees=round(data.tx.filter(t=>t.kind==='transfer').reduce((s,t)=>s+(t.fees||0),0)),p=round(data.tx.filter(t=>t.kind==='profit').reduce((s,t)=>s+t.amount,0)),e=round(data.tx.filter(t=>t.kind==='expense').reduce((s,t)=>s+t.amount,0));let a='بقدر أحكيلك عن الرصيد في أي حساب، ورسوم السحب، والأرباح والمصروفات المسجلة في هذا المتصفح.';if(/paypal|باي.?بال/i.test(q))a=`رصيد PayPal الحالي: ${fmt(data.balances.paypal,'paypal')}.`;else if(/tiktok|تيك.?توك/i.test(q))a=`رصيد TikTok الحالي: ${fmt(data.balances.tiktok,'tiktok')}.`;else if(/usdt/i.test(q))a=`رصيد USDT الحالي: ${fmt(data.balances.usdt,'usdt')}.`;else if(/شيكل/.test(q))a=`رصيد بنك الشيكل: ${fmt(data.balances.ils,'ils')}.`;else if(/رسوم|عمول/.test(q))a=`إجمالي الرسوم المسجلة: ${money(fees)}. وهي تكلفة، وليست ربحًا.`;else if(/ربح|أرباح/.test(q))a=`الأرباح المُدخلة يدويًا: ${money(p)}، والصافي بعد المصروفات والرسوم: ${money(p-e-fees)}.`;else if(/مصروف|فلوسي|أنفق/.test(q))a=`المصروفات المدخلة: ${money(e)}، ورسوم التحويل: ${money(fees)}. الإجمالي: ${money(e+fees)}.`;$('assistantAnswer').textContent=a}
function settingsDialog(){const C=window.FlowCloud;showDialog(`<div class="dialog-head"><h2 class="dialog-title">الإعدادات</h2><button class="close" data-close="true">×</button></div>${C?C.settingsHTML():''}<button class="btn secondary full" id="resetDemo" style="margin-top:10px">تصفير كل البيانات</button>${C?'<button class="btn danger full" id="cloudLogout" style="margin-top:10px">تسجيل الخروج</button>':''}<p class="smallprint">بياناتك تُحفظ في حسابك الخاص وتتزامن بين أجهزتك. يعمل التطبيق بدون إنترنت وتتزامن التغييرات تلقائيًا عند عودة الاتصال.</p>`);C&&C.afterSettings()}
function render(){const main=$('main');main.innerHTML=screen==='home'?home():screen==='wallet'?walletPage():screen==='actions'?actionsPage():screen==='withdraw'?withdrawPage():screen==='transactions'?transactionsPage():reportsPage();document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.nav===screen));if(screen==='withdraw'){if(route==='usdt'){$('destination').addEventListener('change',()=>{$('exchangeWrap').hidden=$('destination').value!=='ils';updateCalc()});$('variableFee').addEventListener('input',updateCalc);$('exchangeRate').addEventListener('input',updateCalc)}$('transferAmount').addEventListener('input',updateCalc);updateCalc()}}
function useRoute(k){route=k;go('withdraw')}
// Event delegation keeps all dynamically rendered buttons operable.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close){closeDialog();return}if(b.dataset.home){closeDialog();go('home');return}if(b.dataset.action==='manual'){manualDialog(b.dataset.wallet||selected);return}if(b.dataset.wallet){selected=b.dataset.wallet;go('wallet');return}if(b.dataset.route){useRoute(b.dataset.route);return}if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.historyfilter){historyFilter=b.dataset.historyfilter;render();return}if(b.dataset.reportfilter){reportFilter=b.dataset.reportfilter;render();return}if(b.dataset.question){answerAssistant(b.dataset.question);return}if(b.id==='reviewBtn'){openReview();return}if(b.id==='finalConfirm'){b.disabled=true;recordTransfer();return}if(b.id==='saveManual'){saveManual();return}if(b.id==='saveEntry'){saveEntry();return}if(b.id==='askAssistant'){answerAssistant($('assistantQuestion').value);return}if(b.id==='resetDemo'){if(confirm('هل تريد حذف جميع الحركات وتصفير كل الأرصدة؟ سيتم ذلك على كل أجهزتك ولا يمكن التراجع عنه.')){data=defaultData();data.epoch=cryptoId();window.FlowCloud&&FlowCloud.markForce();persist();closeDialog();go('home');notify('تم إعادة تعيين البيانات')}return}if(b.id==='settingsBtn'){settingsDialog();return}if(b.dataset.action==='new'){go('actions');return}if(b.dataset.action==='manual'){manualDialog(b.dataset.wallet||selected);return}if(b.dataset.action==='entry'){entryDialog();return}if(b.dataset.action==='assistant'){assistantDialog();return}});
$('overlay').addEventListener('click',e=>{if(e.target.dataset.close)closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeDialog();if(e.key==='Enter'&&e.target.id==='assistantQuestion')answerAssistant(e.target.value)});
/* ===== إدارة الحركات: تعديل وحذف مع إعادة حساب الأرصدة ===== */
const kindLabel={transfer:'تحويل',manual:'تعديل رصيد',profit:'ربح',expense:'مصروف'};
function findTx(id){return data.tx.find(t=>t.id===id)}
function mutateTx(fn){const snap=JSON.stringify(data);fn();const nb=computeBalances(data);const bad=ids.find(k=>nb[k]<0);if(bad){data=JSON.parse(snap);return 'لا يمكن: رصيد '+names[bad]+' سيصبح سالبًا بعد هذا التغيير.'}data.balances=nb;return ''}
function txDialog(id){const t=findTx(id);if(!t)return;const amt=(label)=>`<label for="txAmount" class="field-label">${label}</label><input id="txAmount" class="field" type="number" min="0.01" step="0.01" inputmode="decimal" value="${t.amount}"/>`;let f=`<label for="txTitle" class="field-label">البيان</label><input id="txTitle" class="field" value="${escapeHTML(t.title)}"/>`;if(t.kind==='manual')f+=`<label for="txSign" class="field-label">نوع التعديل</label><select id="txSign" class="field"><option value="1" ${t.sign>0?'selected':''}>إضافة رصيد</option><option value="-1" ${t.sign<0?'selected':''}>خصم رصيد</option></select>`;f+=amt(t.kind==='transfer'?'المبلغ المحوَّل':'المبلغ');if(t.kind==='transfer')f+=`<label for="txFees" class="field-label">الرسوم</label><input id="txFees" class="field" type="number" min="0" step="0.01" inputmode="decimal" value="${t.fees||0}"/><p class="helper">الصافي المُضاف يُحسب تلقائيًا: (المبلغ − الرسوم)${t.fx&&t.fx!==1?' × سعر الصرف '+t.fx:''}.</p>`;showDialog(`<div class="dialog-head"><h2 class="dialog-title">تفاصيل الحركة</h2><button class="close" data-close="true">×</button></div><p class="page-sub">${kindLabel[t.kind]||'حركة'} · ${time(t.date)}</p>${f}<div class="dialog-actions"><button class="btn secondary" data-close="true">إلغاء</button><button class="btn primary" id="saveTx" data-id="${escapeHTML(t.id)}">حفظ التعديل</button></div><button class="btn danger full" id="deleteTx" data-id="${escapeHTML(t.id)}" style="margin-top:10px">حذف الحركة</button>`)}
function saveTx(id){const t=findTx(id);if(!t)return;const title=$('txTitle').value.trim(),amount=Number($('txAmount').value);if(!title){notify('اكتب بيانًا للحركة.');return}if(!(amount>0)||!Number.isFinite(amount)||round(amount)!==amount){notify('أدخل مبلغًا صحيحًا بمنزلتين عشريتين.');return}const nt=Object.assign({},t,{title,amount,upd:Date.now()});if(t.kind==='manual')nt.sign=Number($('txSign').value);if(t.kind==='transfer'){const fees=Number($('txFees').value);if(!Number.isFinite(fees)||fees<0||round(fees)!==fees){notify('أدخل رسومًا صحيحة.');return}const net=round(amount-fees);if(net<=0){notify('الرسوم يجب أن تكون أقل من المبلغ.');return}nt.fees=fees;nt.received=round(net*(t.fx||1))}const err=mutateTx(()=>{data.tx=data.tx.map(x=>x.id===id?nt:x)});if(err){notify(err);return}persist();closeDialog();render();notify('تم تحديث الحركة والأرصدة')}
function deleteTx(id){if(!findTx(id))return;if(!confirm('هل تريد حذف هذه الحركة؟ سيتم تحديث الأرصدة تلقائيًا.'))return;const err=mutateTx(()=>{data.tx=data.tx.filter(x=>x.id!==id);data.deleted[id]=Date.now()});if(err){notify(err);return}persist();closeDialog();render();notify('تم حذف الحركة وتحديث الأرصدة')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){const row=e.target.closest('[data-tx]');if(row)txDialog(row.dataset.tx);return}if(b.id==='saveTx')saveTx(b.dataset.id);else if(b.id==='deleteTx')deleteTx(b.dataset.id)});
document.addEventListener('keydown',e=>{const row=e.target.closest&&e.target.closest('[data-tx]');if(row&&(e.key==='Enter'||e.key===' ')){e.preventDefault();txDialog(row.dataset.tx)}});

window.FlowApp={getData:()=>data,setData:d=>{data=d},defaultData,valid:raw=>!!(raw&&raw.balances&&Array.isArray(raw.tx)&&ids.every(k=>Number.isFinite(raw.balances[k]))),normalize,computeBalances,render,round,notify,STORAGE_KEY,showDialog,closeDialog,isBusy:()=>screen==='withdraw'||!$('overlay').hidden};
</script>
  <script src="flow-cloud.js"></script>
  <script>
if(window.FlowCloud){FlowCloud.start()}else{document.getElementById('gate').innerHTML='<div class="gate-card"><p class="warn">تعذر تحميل ملفات التطبيق. أعد تحميل الصفحة.</p></div>'}
</script>
